<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ABIT Tech Hub</title>

    <script src="theme-init.js"></script>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =========================
         LOGIN PAGE
    ========================== -->

    <main class="register-page">


        <div class="register-card">


            <!-- HEADER -->

            <div class="register-header">

                <a href="index.html" class="back-link">
                    ← Back to home
                </a>

                <div class="register-logo">
                    ABIT <span>Tech Hub</span>
                </div>

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to continue your tech journey.
                </p>

            </div>



            <!-- LOGIN FORM -->

            <form id="loginForm" novalidate>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="example@gmail.com"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleLoginPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>



                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="register-btn"
                >
                    Login →
                </button>



                <!-- MESSAGE -->

                <p
                    class="form-message"
                    id="loginMessage"
                ></p>


            </form>



            <!-- REGISTER LINK -->

            <p class="login-register-text">

                Don't have an account?

                <a href="register.html">
                    Create an account
                </a>

            </p>


        </div>


    </main>


    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script>

    <script src="firebase.js"></script>
    <script src="script.js"></script>

</body>

</html>
